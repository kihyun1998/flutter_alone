# Dependency updates for the package root, example/, and the CI workflow's actions.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    labels:
      - needs-triage
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: monthly
    groups:
      example:
        patterns: ["*"]
    labels:
      - needs-triage
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels:
      - needs-triage
